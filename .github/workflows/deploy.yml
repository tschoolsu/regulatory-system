name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 版本不寫在這裡——action 會讀 package.json 的 packageManager 欄位，
      # 跟本機是同一個真相來源（同 tpass-portal 等消費端 ci.yml 慣例）。
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Cache OG fonts
        uses: actions/cache@v4
        with:
          path: scripts/.fonts
          key: og-fonts-${{ runner.os }}-${{ hashFiles('scripts/gen-og.mjs') }}
          restore-keys: |
            og-fonts-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Verify OG images
        run: |
          count=$(find dist/og -maxdepth 1 -name '*.png' | wc -l)
          echo "Generated OG images: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::No OG preview images were generated (check the og step above / network for Google Fonts)"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
